# Render blueprint — deploys the backend and its database in one step.
#
# Usage: push this repo to GitHub, then in Render click
#   New +  ->  Blueprint  ->  select the repo.
# Render reads this file and creates both services. The only manual step is
# setting CORS_ALLOWED_ORIGINS to your Vercel URL once the frontend is live.

databases:
  - name: collabboard-db
    databaseName: collabboard
    user: collabboard
    plan: free

services:
  - type: web
    name: collabboard-backend
    runtime: docker
    plan: free
    rootDir: collabboard-backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Render supplies a postgresql:// URL. DatabaseUrlEnvironmentPostProcessor
      # converts it to the jdbc:postgresql:// form Spring needs, and pulls the
      # username and password out of it, so nothing else is required here.
      - key: DATABASE_URL
        fromDatabase:
          name: collabboard-db
          property: connectionString
      # Set this to your deployed frontend origin, e.g.
      #   https://collabboard.vercel.app
      # Leaving it as * works but allows any site to call your API.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
