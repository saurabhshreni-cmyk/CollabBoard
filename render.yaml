# Render blueprint — deploys the whole app (web UI + API + database) in one step.
#
# Usage: push this repo to GitHub, then in Render click
#   New +  ->  Blueprint  ->  select the repo  ->  Apply.
# There is nothing to configure afterwards: the server serves the web UI
# itself, so the app lives at a single URL with no cross-origin settings.

databases:
  - name: collabboard-db
    databaseName: collabboard
    user: collabboard
    plan: free

services:
  - type: web
    name: collabboard
    runtime: docker
    plan: free
    # The root Dockerfile builds the frontend and bakes it into the server.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Render supplies a postgresql:// URL. DatabaseUrlEnvironmentPostProcessor
      # converts it to the jdbc:postgresql:// form Spring needs, and pulls the
      # username and password out of it, so nothing else is required here.
      - key: DATABASE_URL
        fromDatabase:
          name: collabboard-db
          property: connectionString
      # CORS_ALLOWED_ORIGINS is deliberately not set: the server then allows
      # only its own public URL (RENDER_EXTERNAL_URL, provided by Render).
      # Set it only if you host the frontend somewhere else, e.g. on Vercel.
