# Render blueprint — deploys the whole app (web UI + API + WebSocket) as one
# free web service.
#
# The database is NOT created here. Render's free PostgreSQL is deleted 30 days
# after creation, so the app uses an external PostgreSQL instead — for example
# Neon's free plan, which does not expire (see DEPLOY.md).
#
# Usage: push this repo to GitHub, then in Render click
#   New +  ->  Blueprint  ->  select the repo  ->  Apply
# Render asks for DATABASE_URL once; paste the database's connection string.

services:
  - type: web
    name: collabboard
    runtime: docker
    plan: free
    # The root Dockerfile builds the frontend and bakes it into the server.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # A postgresql:// connection string, e.g. from Neon:
      #   postgresql://user:password@ep-xxxx.region.aws.neon.tech/neondb?sslmode=require
      # DatabaseUrlEnvironmentPostProcessor converts it to the jdbc:postgresql://
      # form Spring needs and pulls the username and password out of it.
      # `sync: false` means Render asks for the value and never overwrites it.
      - key: DATABASE_URL
        sync: false
      # CORS_ALLOWED_ORIGINS is deliberately not set: the server then allows
      # only its own public URL (RENDER_EXTERNAL_URL, provided by Render).
      # Set it only if you host the frontend somewhere else, e.g. on Vercel.
