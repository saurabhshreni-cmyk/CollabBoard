name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabboard-backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The wrapper pins the Maven version, so CI builds exactly like a laptop.
      - name: Test and package
        run: ./mvnw -B verify

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: collabboard-backend-jar
          path: collabboard-backend/target/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend (Node 22 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabboard-frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: collabboard-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint -- --max-warnings 0

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: collabboard-frontend-dist
          path: collabboard-frontend/dist
          if-no-files-found: error

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The image render.yaml deploys: frontend baked into the server.
      - name: Build single-service image
        run: docker build -t collabboard:ci .

      - name: Build backend image
        run: docker build -t collabboard-backend:ci ./collabboard-backend

      - name: Build frontend image
        run: docker build -t collabboard-frontend:ci ./collabboard-frontend
