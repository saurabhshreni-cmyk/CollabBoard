# CollabBoard — full stack in one command:  docker compose up --build
# Then open http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    container_name: collabboard-db
    environment:
      POSTGRES_DB: collabboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - collabboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collabboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./collabboard-backend
    container_name: collabboard-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/collabboard
      DB_USERNAME: postgres
      DB_PASSWORD: password
      PORT: "8080"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./collabboard-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_URL: http://localhost:8080/ws
    container_name: collabboard-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  collabboard_pgdata:
