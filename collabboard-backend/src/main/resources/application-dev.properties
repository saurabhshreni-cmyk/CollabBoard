# Local development profile: in-memory H2, no PostgreSQL install required.
#
#   mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# The board lives in memory, so everything resets when the process stops.
# For persistence across restarts, drop this profile and use the PostgreSQL
# settings in application.properties instead.
spring.datasource.url=jdbc:h2:mem:collabboard;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Browse the dev database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:collabboard, user: sa, no password)
spring.h2.console.enabled=true

# Vite dev server, plus any machine on the local network (so a phone or a
# colleague's laptop on the same WiFi can open http://<your-ip>:5173).
# (dev only — a real deployment sets CORS_ALLOWED_ORIGINS to an exact origin)
app.cors.allowed-origins=http://*:5173,http://*:4173
