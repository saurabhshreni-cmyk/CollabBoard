# ---- Database -------------------------------------------------------------
# DATABASE_URL (the postgresql:// form Render/Heroku/Railway inject) is also
# understood: see DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/collabboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Free-tier databases allow few connections; this app needs very few.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- HTTP -----------------------------------------------------------------
server.port=${PORT:8080}
# Let in-flight requests finish when the platform restarts the instance.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Board snapshots are JSON and compress very well; so does the web UI when
# this server is the one serving it.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
# Behind Render's (or any) reverse proxy, trust X-Forwarded-* so the client
# address and scheme are the real ones.
server.forward-headers-strategy=native
# Errors as RFC 7807 JSON: {"status":404,"detail":"Room not found: ABC123"}
spring.mvc.problemdetails.enabled=true
spring.jackson.serialization.fail-on-empty-beans=false

# ---- WebSocket ------------------------------------------------------------
# Tomcat's default WebSocket frame buffer is 8 KB; a long pen stroke is bigger
# and would close the socket. Keep in step with WebSocketConfig.MAX_MESSAGE_BYTES.
server.servlet.context-parameters.org.apache.tomcat.websocket.textBufferSize=262144
server.servlet.context-parameters.org.apache.tomcat.websocket.binaryBufferSize=262144

# ---- Application ----------------------------------------------------------
# Comma-separated origins allowed to call the API and open the WebSocket.
# Resolution: CORS_ALLOWED_ORIGINS if set; otherwise the service's own public
# URL, which Render provides as RENDER_EXTERNAL_URL (right for the
# single-service deployment, where the frontend is served from here);
# otherwise "*", which is convenient locally.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${RENDER_EXTERNAL_URL:*}}
# Delete rooms with no activity for this many days. 0 = never delete.
app.rooms.retention-days=${ROOM_RETENTION_DAYS:0}
app.rate-limit.room-creations-per-minute=${ROOM_CREATIONS_PER_MINUTE:20}
